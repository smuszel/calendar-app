<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Notes Calendar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" id="manifest">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6c6c6c 0%, #93aedb 100%);
            color: #333;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-controls {
            width: 95%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        .app-title {
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .menu-btn {
            background: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #4a5568;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .menu-content {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 100;
            overflow: hidden;
            flex-direction: column;
        }

        .menu-content.show {
            display: flex;
        }

        .menu-content button {
            padding: 12px 20px;
            border: none;
            background: none;
            text-align: left;
            cursor: pointer;
            font-size: 0.9rem;
            color: #333;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-content button:hover {
            background: #f1f5f9;
        }

        .days-container {
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            width: 95%;
            max-width: 1000px;
            height: 80vh;
            overflow-y: auto;
            background: white;
        }
        
        .day-row {
            display: flex;
            border-bottom: 1px solid #e2e8f0;
            min-height: 50px;
            align-items: stretch;
        }
        
        .date-section {
            width: 130px;
            min-width: 130px;
            background: #f8fafc;
            padding: 0 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 2px solid #e2e8f0;
        }
        
        .date-text {
            font-size: 0.85rem;
            color: #4a5568;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        
        .today .date-section {
            background: #ebf8ff;
            border-right: 2px solid #90cdf4;
        }
        
        .today .date-text {
            color: #3182ce;
            font-weight: 600;
        }

        .NIC {
            flex-grow: 1;
            background: white;
            display: flex;
            align-items: center;
        }
        
        .note-input {
            width: 100%;
            height: 100%;
            padding: 10px 12px;
            border: none;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 48px;
            background: transparent;
            outline: none;
        }

        @media (max-width: 600px) {
            .day-row {
                flex-direction: column;
            }

            .date-section {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e2e8f0;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header-controls">
        <h1 class="app-title">Daily Notes</h1>
        <div>
            <button class="menu-btn" id="menuBtn">
                <i class="fa-solid fa-bars"></i> Menu
            </button>
            <div class="menu-content" id="menuContent">
                <button id="todayBtn"><i class="fa-solid fa-calendar-day"></i> Go to Today</button>
                <button id="addDaysBtn"><i class="fa-solid fa-plus"></i> Add 30 Days</button>
                <button id="clearAllBtn"><i class="fa-solid fa-trash"></i> Clear All Notes</button>
            </div>
        </div>
    </div>
        
    <div class="days-container" id="daysContainer">
        <!-- Day rows will be generated here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const daysContainer = document.getElementById('daysContainer');
            const menuBtn = document.getElementById('menuBtn');
            const menuContent = document.getElementById('menuContent');
            const addDaysBtn = document.getElementById('addDaysBtn');
            const todayBtn = document.getElementById('todayBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            
            const DAYS_TO_SHOW = 150;
            let daysAdded = 0;
            
            // Toggle dropdown menu
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                menuContent.classList.toggle('show');
            });

            document.addEventListener('click', () => {
                menuContent.classList.remove('show');
            });

            addDaysBtn.addEventListener('click', addMoreDays);
            todayBtn.addEventListener('click', scrollToToday);
            clearAllBtn.addEventListener('click', clearAllNotes);

            // Initialize app and PWA
            setupPWA();
            loadDays();
            
            function loadDays() {
                daysContainer.innerHTML = '';
                const today = new Date();
                
                for (let i = 0; i < DAYS_TO_SHOW; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    addDayRow(date, i === 0);
                }
                
                daysAdded = DAYS_TO_SHOW;
            }
            
            function addMoreDays() {
                const today = new Date();
                for (let i = daysAdded; i < daysAdded + 30; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);
                    addDayRow(date, false);
                }
                
                daysAdded += 30;
                menuContent.classList.remove('show');
            }
            
            function addDayRow(date, isToday) {
                const dateString = date.toDateString();
                
                const dayRow = document.createElement('div');
                dayRow.className = 'day-row';
                if (isToday) {
                    dayRow.classList.add('today');
                }
                
                const dayName = date.toLocaleString('default', { weekday: 'short' });
                const month = date.toLocaleString('default', { month: 'short' });
                const day = date.getDate();
                
                const dateSection = document.createElement('div');
                dateSection.className = 'date-section';
                
                const dateText = document.createElement('div');
                dateText.className = 'date-text';
                dateText.innerHTML = `<span>${dayName}</span><span>${month} ${day}</span>`;
                
                dateSection.appendChild(dateText);
                
                const noteInput = document.createElement('textarea');
                noteInput.className = 'note-input';
                
                const savedNote = getNote(dateString);
                if (savedNote) {
                    noteInput.value = savedNote;
                }
                
                noteInput.addEventListener('input', function() {
                    saveNote(dateString, this.value);
                });

                const noteInputContainer = document.createElement('div');
                noteInputContainer.classList.add('NIC');
                
                dayRow.appendChild(dateSection);
                noteInputContainer.appendChild(noteInput);
                dayRow.appendChild(noteInputContainer);
                
                daysContainer.appendChild(dayRow);
            }
            
            function scrollToToday() {
                const todayRow = document.querySelector('.today');
                if (todayRow) {
                    todayRow.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
                menuContent.classList.remove('show');
            }
            
            function saveNote(date, text) {
                const notes = getNotes();
                notes[date] = text;
                localStorage.setItem('dailyNotes', JSON.stringify(notes));
            }
            
            function getNote(date) {
                const notes = getNotes();
                return notes[date] || '';
            }
            
            function getNotes() {
                const notesJSON = localStorage.getItem('dailyNotes');
                return notesJSON ? JSON.parse(notesJSON) : {};
            }
            
            function clearAllNotes() {
                if (confirm('Are you sure you want to clear all notes? This cannot be undone.')) {
                    localStorage.removeItem('dailyNotes');
                    const textareas = document.querySelectorAll('.note-input');
                    textareas.forEach(textarea => {
                        textarea.value = '';
                    });
                }
                menuContent.classList.remove('show');
            }
            
            function setupPWA() {
                const manifest = {
                    "name": "Daily Notes",
                    "short_name": "Daily Notes",
                    "description": "A simple app for daily notes",
                    "start_url": "./",
                    "display": "standalone",
                    "background_color": "#6c6c6c",
                    "theme_color": "#6c6c6c",
                    "icons": [
                        {
                            "src": "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIxOTIiIGhlaWdodD0iMTkyIiByeD0iNDAiIGZpbGw9IiM0Nzc2RTYiLz4KPHBhdGggZD0iTTc2IDU2VjEzNkgxMTZWNTZINzZaIiBmaWxsPSJ3aGl0ZSIvPgo8cGF0aCBkPSJNMTM2IDk2SDE0NEgxNTJWMTM2SDEzNlY5NloiIGZpbGw9IndoaXRlIi8+CjxwYXRoIGQ9Ik00OCA5NkM0OCA4Mi43NDYgNTguNzQ2IDcyIDcyIDcySDEyMEMxMzMuMjU0IDcyIDE0NCA4Mi43NDYgMTQ0IDk2VjEzNkMxNDQgMTQ5LjI1NCAxMzMuMjU0IDE2MCAxMjAgMTYwSDcyQzU4Ljc0NiAxNjAgNDggMTQ5LjI1NCA0OCAxMzZWOTZaIiBmaWxsPSJ3aGl0ZSIvPgo8L3N2Zz4K",
                            "sizes": "192x192",
                            "type": "image/svg+xml"
                        }
                    ]
                };
                
                const manifestJSON = JSON.stringify(manifest);
                const blob = new Blob([manifestJSON], {type: 'application/json'});
                const manifestURL = URL.createObjectURL(blob);
                document.getElementById('manifest').href = manifestURL;
            }

            // Register Service Worker for offline capability
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('Service Worker Registered Successfully'))
                    .catch((err) => console.error('Service Worker Registration Failed:', err));
            }
        });
    </script>
</body>
</html>
